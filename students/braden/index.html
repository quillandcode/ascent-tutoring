<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brendan's Tutoring Sessions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="parent-page">
    
    <div class="nav-header">
        <div class="nav-container">
            <div class="nav-left">
                <a href="../../index.html" class="nav-btn back-btn">
                    <span>←</span>
                    <span>Home</span>
                </a>
                
                <div class="student-identity">
                    <div class="identity-name">BRADEN</div>
                    <div class="identity-details">
                        <span class="detail-pill">Pre-Calculus</span>
                        <span class="detail-pill">Grade 11</span>
                    </div>
                </div>
            </div>

            <div class="nav-right">
                <div class="session-selector">
                    <label for="sessionSelect">Select Session:</label>
                    <select id="sessionSelect" onchange="loadSession()">
                        <option value="2026-2-2.html" selected>February 2, 2026 (2nd Session)</option>
                        <option value="2026-1-12.html">January 12, 2026 (1st Session)</option>
                    </select>
                </div>

                <a href="https://docs.google.com/forms/d/e/1FAIpQLSfZBJdmUtCFnfdPWKbHUigzNi20rMQpnYXYhl50wX1n9eDXUw/viewform" 
                   target="_blank" 
                   class="nav-btn action-btn">
                   📝 Weekly Check-in
                </a>
            </div>
        </div>
    </div>

    <iframe id="sessionFrame" class="main-iframe" src="" title="Session Content"></iframe>

    <script>
        function loadSession() {
            const select = document.getElementById('sessionSelect');
            const iframe = document.getElementById('sessionFrame');
            iframe.src = select.value;
        }

        loadSession();
    </script>
</body>
</html>
